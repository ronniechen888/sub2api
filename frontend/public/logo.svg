<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Definitions for gradients -->
  <defs>
    <!-- Deeper Purple/Violet gradient for the cloud -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" /> <!-- Purple 400 (Rich Lavender) -->
      <stop offset="100%" stop-color="#6d28d9" /> <!-- Violet 700 (Deep Royal Violet) -->
    </linearGradient>
    <!-- Deeper Neon Fuchsia/Purple gradient for the lightning -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" /> <!-- Fuchsia 400 (Vibrant Luminous Fuchsia) -->
      <stop offset="100%" stop-color="#a21caf" /> <!-- Fuchsia 700 (Deep Velvet Purple) -->
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shift the entire cloud and lightning design down by 8% Y-axis to center it beautifully -->
  <g transform="translate(0, 8)">
    <!-- Abstract layered sky-blue cloud path -->
    <path
      d="M18,60 C12,60 8,54 8,46 C8,38 14,32 22,32 C23.5,32 25,32.3 26.5,33 C30.5,23 39.5,16 50,16 C63.5,16 74.5,26 75.5,39 C76.5,38.7 77.5,38.5 78.5,38.5 C85,38.5 90,43.5 90,50 C90,56.5 85,61.5 78.5,61.5 C78,61.5 22,61.5 18,60 Z"
      fill="url(#cloudGrad)"
      fill-opacity="0.9"
    />

    <!-- Subtle translucent highlight slice inside the cloud -->
    <path
      d="M26.5,33 C30.5,23 39.5,16 50,16 C57,16 63.5,19.5 67.5,25 C62.5,25 55,30 51.5,38.5 C48,47 49,55 53.5,61 L22,61 C22,61 24,51 29.5,43 C35,35 30,33 26.5,33 Z"
      fill="#ffffff"
      fill-opacity="0.18"
    />

    <!-- Sharp Neon Cyan lightning bolt slicing through -->
    <polygon
      points="55 12 37 42 47 42 38 78 64 40 51 40"
      fill="url(#boltGrad)"
      filter="url(#neonGlow)"
    />
  </g>
</svg>
